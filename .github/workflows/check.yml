name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/release_check.py
  container:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/manage.py init --url https://test.example.invalid
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose run --rm --no-deps --user 0 --cap-add CHOWN --cap-add FOWNER backend python tools/manage.py prepare-data
      - run: docker compose up -d
      - run: python tools/container_smoke.py
      - name: Optional toolkit installation
        run: docker compose exec -T backend agent-reach version
      - name: Prepare optional X tools without any user session
        run: docker compose exec -T backend python tools/setup_x.py
      - name: Pinned local speech-language setup
        run: docker compose exec -T backend python tools/setup_language.py
      - name: Stop this disposable instance
        if: always()
        run: docker compose down
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:testReleaseUnitTest :app:assembleDebug :app:lintDebug --console=plain
        working-directory: android
